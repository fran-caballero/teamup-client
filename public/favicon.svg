<svg
  viewBox="0 0 24 24"
  role="img"
  xmlns="http://www.w3.org/2000/svg"
  aria-labelledby="gradientChevronsIconTitle"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
  fill="none"
>
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color: #f814de; stop-opacity: 1" />
      <stop offset="100%" style="stop-color: #f9b922; stop-opacity: 1" />
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color: #8048fb; stop-opacity: 1" />
      <stop offset="100%" style="stop-color: #63b1f9; stop-opacity: 1" />
    </linearGradient>
  </defs>
  <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
  <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
  <g id="SVGRepo_iconCarrier">
    <title id="gradientChevronsIconTitle">Gradient Chevrons</title>
    <polyline points="9 7 4 12 9 17" stroke="url(#gradient1)"></polyline>
    <polyline points="15 7 20 12 15 17" stroke="url(#gradient2)"></polyline>
  </g>
</svg>
