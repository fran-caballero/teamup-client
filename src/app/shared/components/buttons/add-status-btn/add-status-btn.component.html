<button class="add-status-btn" [matMenuTriggerFor]="addStatusMenu">
  <span
    class="add-status-btn-symbol add-status-btn-symbol--add material-symbols-outlined"
    >add</span
  >
  Add status
</button>

<mat-menu class="add-status-menu" #addStatusMenu>
  <form class="add-status-menu-form" [formGroup]="addStatusForm">
    <button
      #setStatusTypeMenuTrigger="matMenuTrigger"
      class="set-status-type-btn"
      type="button"
      [matMenuTriggerFor]="setStatusTypeMenu"
      (click)="$event.stopPropagation()"
    >
      @if (addStatusForm.controls.statusType.value; as statusType) {
        @switch (statusType) {
          @case ("not_started") {
            <span
              class="set-status-type-btn__symbol set-status-type-btn__symbol--radio_button_unchecked material-symbols-outlined"
              [ngStyle]="{
                color: addStatusForm.controls.statusColor.value
                  ? addStatusForm.controls.statusColor.value![
                      currentColorTheme()!
                    ]
                  : getDefaultColor(14)![currentColorTheme()!],
              }"
              >radio_button_unchecked</span
            >
            NOT STARTED
          }
          @case ("active") {
            <span
              class="set-status-type-btn__symbol set-status-type-btn__symbol--radio_button_partial material-symbols-outlined"
              [ngStyle]="{
                color: addStatusForm.controls.statusColor.value
                  ? addStatusForm.controls.statusColor.value![
                      currentColorTheme()!
                    ]
                  : getDefaultColor(3)![currentColorTheme()!],
              }"
              >radio_button_partial</span
            >
            ACTIVE
          }
          @case ("done") {
            <span
              class="set-status-type-btn__symbol set-status-type-btn__symbol--check_circle material-symbols-outlined"
              [ngStyle]="{
                color: addStatusForm.controls.statusColor.value
                  ? addStatusForm.controls.statusColor.value![
                      currentColorTheme()!
                    ]
                  : getDefaultColor(6)![currentColorTheme()!],
              }"
              >check_circle</span
            >DONE
          }
        }
      } @else {
        STATUS TYPE
        <span
          class="set-status-type-btn__symbol set-status-type-btn__symbol--keyboard-arrow-down material-symbols-outlined"
        >
          keyboard_arrow_down
        </span>
      }
    </button>
    <mat-menu class="set-status-type-menu" #setStatusTypeMenu>
      <div class="set-status-type-menu__content">
        <button
          class="set-status-type-menu__btn set-status-type-menu__btn--not-started"
          (click)="
            onClickSelectStatus('not_started');
            setStatusTypeMenuTrigger.closeMenu();
            $event.stopPropagation()
          "
        >
          <span
            class="set-status-type-menu__symbol set-status-type-menu__symbol--radio_button_unchecked material-symbols-outlined"
            [ngStyle]="{
              color:
                addStatusForm.controls.statusColor.value &&
                addStatusForm.controls.statusType.value === 'not_started'
                  ? addStatusForm.controls.statusColor.value![
                      currentColorTheme()!
                    ]
                  : getDefaultColor(14)![currentColorTheme()!],
            }"
            >radio_button_unchecked</span
          >
          NOT STARTED
        </button>
        <button
          class="set-status-type-menu__btn set-status-type-menu__btn--active"
          (click)="
            onClickSelectStatus('active');
            setStatusTypeMenuTrigger.closeMenu();
            $event.stopPropagation()
          "
        >
          <span
            class="set-status-type-menu__symbol set-status-type-menu__symbol--radio_button_partial material-symbols-outlined"
            [ngStyle]="{
              color:
                addStatusForm.controls.statusColor.value &&
                addStatusForm.controls.statusType.value === 'active'
                  ? addStatusForm.controls.statusColor.value![
                      currentColorTheme()!
                    ]
                  : getDefaultColor(3)![currentColorTheme()!],
            }"
            >radio_button_partial</span
          >
          ACTIVE
        </button>
        <button
          class="set-status-type-menu__btn set-status-type-menu__btn--done"
          (click)="
            onClickSelectStatus('done');
            setStatusTypeMenuTrigger.closeMenu();
            $event.stopPropagation()
          "
        >
          <span
            class="set-status-type-menu__symbol set-status-type-menu__symbol--check_circle material-symbols-outlined"
            [ngStyle]="{
              color:
                addStatusForm.controls.statusColor.value &&
                addStatusForm.controls.statusType.value === 'done'
                  ? addStatusForm.controls.statusColor.value![
                      currentColorTheme()!
                    ]
                  : getDefaultColor(6)![currentColorTheme()!],
            }"
            >check_circle</span
          >
          DONE
        </button>
      </div>
    </mat-menu>

    <div class="add-status-menu__input-container">
      <input
        class="add-status-menu__input"
        id="new-status-name"
        placeholder="STATUS NAME"
        autocomplete="off"
        oninput="this.value = this.value.toUpperCase()"
        formControlName="statusName"
        (click)="$event.stopPropagation()"
      />
      <span
        class="save-new-status-btn-tooltip-wrapper"
        [matTooltipClass]="'center-tooltip-text'"
        [matTooltip]="getTooltipMessage()"
        [matTooltipDisabled]="!isSaveDisabled()"
      >
        <button
          type="button"
          class="save-new-status-btn"
          [disabled]="isSaveDisabled()"
          (click)="onClickSave()"
        >
          Save
        </button>
      </span>
    </div>
    <app-color-picker-menu
      #colorPickerMenuComponent
      [selectedDefaultColor]="addStatusForm.controls.statusColor.value"
      (selectedDefaultColorChange)="onColorChange($event)"
    />
  </form>
</mat-menu>
